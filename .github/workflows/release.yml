name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the package and manifest versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          manifest_version=$(node -p "require('./public/manifest.json').version")
          if [ "$TAG" != "v$package_version" ] || [ "$package_version" != "$manifest_version" ]; then
            echo "::error::Tag $TAG, package.json $package_version and manifest $manifest_version must match."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Package Chrome and Edge extensions with checksums
        run: node scripts/package.mjs
      # Marketplace submission stays manual for v0.1 (docs/release/store-submission.md).
      - name: Create the GitHub release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/postnook-*.zip artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "PostNook $TAG" --generate-notes --draft
